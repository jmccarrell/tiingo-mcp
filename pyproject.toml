[project]
name = "tiingo-mcp"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
tiingo-mcp = "tiingo_mcp.server:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx"]

[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["tiingo_mcp", "tests"]

[tool.coverage.report]
show_missing = true
skip_covered = true
